<!DOCTYPE html>
<html lang="uz" data-theme="blue" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USTURLOB</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Formulalar (KaTeX) -->
  <link rel="stylesheet" href="https://jsdelivr.net">
  <script defer src="https://jsdelivr.net"></script>
  <script defer src="https://jsdelivr.net"></script>
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <div class="brand" id="homeBtn">
        <span class="brand-title">USTURLOB</span>
        <span class="brand-subtitle">Fizika & Matematika</span>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="searchToggleBtn" title="Qidiruv">🔍</button>
        <button class="icon-btn" id="themeToggleBtn" title="Temalar">🎨</button>
        <button class="icon-btn" id="modeToggleBtn" title="Kun / Tun">☀️</button>
        <button class="icon-btn" id="aboutBtn" title="O'zim haqimda">👤</button>
      </div>
    </div>

    <div class="search-bar container hidden" id="searchBar">
      <input type="text" id="searchInput" placeholder="Qidirish...">
      <button class="close-btn" id="searchCloseBtn">✕</button>
    </div>

    <div class="theme-dropdown hidden" id="themeDropdown"></div>
  </header>

  <main class="container main-content">

    <section id="homeView">
      <div class="owl-wrapper">
        <div id="owlContainer"></div>
      </div>
      <div class="sections-grid" id="sectionsGrid"></div>
    </section>

    <section id="subView" class="hidden">
      <div class="sub-header">
        <div class="nav-btns">
          <button class="back-btn" id="backBtn">← Orqaga</button>
          <button class="back-btn" id="subHomeBtn" title="Bosh sahifa">🏠</button>
        </div>
        <div class="sub-title-wrap">
          <div class="breadcrumb" id="breadcrumb"></div>
          <h2 id="subTitle"></h2>
        </div>
      </div>
      <div id="subContent"></div>
    </section>

    <section id="searchView" class="hidden">
      <div class="sub-header">
        <button class="back-btn" id="searchBackBtn">🏠 Bosh sahifa</button>
        <h2>Qidiruv</h2>
      </div>
      <div id="searchResults" class="sections-grid"></div>
    </section>

  </main>

  <div class="modal-overlay hidden" id="aboutModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>O'zim haqimda</h3>
        <button class="close-btn" id="aboutCloseBtn">✕</button>
      </div>
      <div class="modal-body" id="aboutContent"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="social-links">
        <a href="https://t.me" target="_blank" class="social-link">📢 Usturlob</a>
        <a href="https://t.me" target="_blank" class="social-link">💬 @Phismath21</a>
        <a href="https://t.me" target="_blank" class="social-link">👤 @Abdullayev2104</a>
      </div>
    </div>
  </footer>
  <script src="js/fizika/mavzular.js"></script>
  <script src="js/fizika/masalalar.js"></script>
  <script src="js/fizika/lab.js"></script>
  <script src="js/fizika/oyinlar.js"></script>
  <script src="js/fizika/jadvallar.js"></script>
  <script src="js/fizika/materiallar.js"></script>

  <script src="js/data.js?v=5"></script>
  <script src="js/owl.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
